# ─────────────────────────────────────────────────────────────────────────────
# Nginx — proxy reverso + SSL para o RENDE IA
#
# Instalação na VPS:
#   sudo cp deploy/nginx-rende-ia.conf /etc/nginx/sites-available/rende-ia
#   sudo ln -s /etc/nginx/sites-available/rende-ia /etc/nginx/sites-enabled/rende-ia
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (Let's Encrypt) — rode DEPOIS de o bloco :80 já estar ativo:
#   sudo certbot --nginx -d rende-ia.com.br -d www.rende-ia.com.br
# O certbot injeta as linhas ssl_certificate automaticamente e cria a renovação
# via systemd timer. Se preferir gerenciar manualmente, descomente o bloco :443.
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → força HTTPS (o certbot também cuida disto, mas deixamos explícito)
server {
    listen 80;
    listen [::]:80;
    server_name rende-ia.com.br www.rende-ia.com.br;

    # Permite o desafio ACME do certbot antes do redirect
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rende-ia.com.br www.rende-ia.com.br;

    # Estas linhas são preenchidas pelo certbot. Se for configurar SSL na mão,
    # aponte para seus certificados:
    # ssl_certificate     /etc/letsencrypt/live/rende-ia.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rende-ia.com.br/privkey.pem;

    # Corpo pequeno: o payload de /api/analise é um JSON minúsculo.
    client_max_body_size 2m;

    # Hardening básico de cabeçalhos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A análise pode levar dezenas de segundos (retries do Gemini com backoff
        # 2s→4s→8s). Damos folga para não cortar a requisição no meio.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
